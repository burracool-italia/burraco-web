<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prova audio</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  button { display: block; width: 100%; font-size: 20px; padding: 14px; margin: 10px 0; border-radius: 10px;
           border: 1px solid #1B5EA5; background: #1B5EA5; color: #fff; }
  button.b2 { background: #fff; color: #1B5EA5; }
  #log { font-family: ui-monospace, monospace; font-size: 14px; white-space: pre-wrap; background: #f3f3f3;
         padding: 10px; border-radius: 8px; min-height: 120px; }
</style>
</head>
<body>
<h2>Prova audio</h2>
<p>Premi i pulsanti uno alla volta, dall'alto. Poi fai uno screenshot di tutta la pagina.</p>
<button onclick="suona(0.1, 'A')">1. Suono PIANO (10%)</button>
<button onclick="suona(1.0, 'B')">2. Suono FORTE (100%)</button>
<button class="b2" onclick="htmlAudio(0.1)">3. Vecchio lettore al 10%</button>
<div id="log"></div>
<script>
  var log = function (t) { document.getElementById('log').textContent += t + '\n'; };
  var URL_SUONO = 'assets/assets/sounds/notification.wav';
  var ac = null, buf = null;
  log('Browser: ' + navigator.userAgent.replace(/Mozilla\/5.0 /, ''));
  log('Dalla Home: ' + ((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true));
  log('AudioContext: ' + (window.AudioContext ? 'si' : (window.webkitAudioContext ? 'solo webkit' : 'NO')));
  function suona(vol, quale) {
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!ac) { ac = new C(); log(quale + ') creato, stato: ' + ac.state); }
      if (ac.state !== 'running') { ac.resume().then(function () { log(quale + ') resume ok, stato: ' + ac.state); },
                                                     function (e) { log(quale + ') resume ERRORE: ' + e); }); }
      var vuoto = ac.createBufferSource(); vuoto.buffer = ac.createBuffer(1, 1, 22050);
      vuoto.connect(ac.destination); vuoto.start(0);
      log(quale + ') stato subito dopo il tocco: ' + ac.state);
      var pronto = buf ? Promise.resolve(buf) : fetch(URL_SUONO).then(function (r) {
        log(quale + ') file: HTTP ' + r.status); return r.arrayBuffer();
      }).then(function (d) {
        return new Promise(function (ok, ko) { ac.decodeAudioData(d, ok, ko); });
      });
      pronto.then(function (b) {
        buf = b;
        log(quale + ') file decodificato, stato: ' + ac.state);
        var src = ac.createBufferSource(); src.buffer = b;
        var g = ac.createGain(); g.gain.value = vol;
        src.connect(g); g.connect(ac.destination); src.start(0);
        log(quale + ') SUONATO al ' + Math.round(vol * 100) + '%');
      }).catch(function (e) { log(quale + ') ERRORE: ' + (e && (e.message || e.name) || e)); });
    } catch (e) { log(quale + ') ERRORE: ' + e.message); }
  }
  function htmlAudio(vol) {
    var a = new Audio(URL_SUONO); a.volume = vol;
    log('C) vecchio lettore, volume chiesto ' + vol + ', volume reale ' + a.volume);
    a.play().catch(function (e) { log('C) ERRORE: ' + e); });
  }
</script>
</body>
</html>
